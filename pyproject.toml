[project]
name = "rl-microgrid"
version = "0.1.0"
description = "Simulation of a Microgrid and Reinforcement Learning an Energy Model"
readme = "README.md"
authors = [
    { name = "Bennet Märtin", email = "bmaertin@stud.hs-offenburg.de" },
    { name = "Joshua Ruf", email = "jruf1@stud.hs-offenburg.de" },
    { name = "Markus Portugall", email = "markus.portugall@gmx.de" },
    { name = "Nick Abermeth", email = "nabermet@stud.hs-offenburg.de" },
    { name = "Yannik Heizmann", email = "yheizman@stud.hs-offenburg.de" },
]
requires-python = "==3.12.*"
dependencies = [
    "dotenv>=0.9.9",
    "gymnasium>=1.1.1",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "numpy",
    "pandas>=2.2.3",
    "pydantic>=2.11.1",
    "requests>=2.32.3",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "stable-baselines3[extra]>=2.6.0",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "wandb>=0.19.10",
]

[project.scripts]
rl-microgrid = "rl_microgrid.main:Main.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pylint>=3.3.6",
    "pytest>=8.3.5",
    "ruff>=0.11.2",
]
[tool.ruff]
line-length = 120
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
